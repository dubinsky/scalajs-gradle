pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  // A parent includeBuild is not visible when this settings script resolves plugins.
  // 0.4.0 is not published, so include the local checkout even if a parent also did.
  // Gradle 9.8.2 accepts that second include of the same directory.
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.4.0'
}

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'org.podval.tools.scalajs'
