plugins {
  id 'scala'
  id 'org.podval.conventions'
  id 'org.podval.conventions.publish'
  id 'org.podval.tools.scala' version '2.2.0'
  id 'com.gradle.plugin-publish' version '2.2.1'
}

scalaBackend {
  useArtifactSuffix = false
}

group = 'org.podval.tools'
version = version_plugin
description = 'Gradle plugin for cross-compiling to JVM, Scala.js and Scala Native'

scala.scalaVersion = version_scala
// Gradle 9.8.1 still defaults Zinc to 1.12.0.
scala.zincVersion = '1.12.1'
project.gradle.startParameter.excludedTaskNames.add('compileJava')

dependencies {
  // plugin development plugin added by the plugin publishing plugin
  // supposedly adds gradleApi dependency to the 'api' configuration,
  // but with Gradle 9.4.0-rc-1 I got ClassNotFound without this explicit dependency:
  implementation gradleApi()

  // for TestClassVisitor
  implementation 'org.ow2.asm:asm:9.10.1'

  // for running tests
  compileOnly "org.scala-sbt:test-interface:$version_sbt_test_interface"

  // Scala.js support
  compileOnly "org.scala-js:scalajs-linker_2.13:$version_scalajs"
  compileOnly "org.scala-js:scalajs-sbt-test-adapter_2.13:$version_scalajs"
  compileOnly "org.scala-js:scalajs-env-jsdom-nodejs_2.13:$version_scalajs_env_jsdom_nodejs"

  // Scala Native support
  compileOnly "org.scala-native:tools_native0.5_3:$version_scalanative"
  compileOnly "org.scala-native:test-runner_3:$version_scalanative"

  // test frameworks
  compileOnly "junit:junit:$version_junit"
  compileOnly "org.wvlet.airframe:airspec_3:$version_framework_airspec"
  compileOnly "qa.hedgehog:hedgehog-sbt_3:$version_framework_hedgehog"
  compileOnly "org.scalameta:munit_3:$version_framework_munit"
  compileOnly "org.scalacheck:scalacheck_3:$version_framework_scalacheck"
  compileOnly "com.github.scalaprops:scalaprops_3:$version_framework_scalaprops"
  compileOnly "org.scalatest:scalatest_3:$version_framework_scalatest"
  compileOnly "org.specs2:specs2-core_3:$version_framework_specs2"
  compileOnly "com.lihaoyi:utest_3:$version_framework_utest"
  compileOnly "org.typelevel:weaver-cats_3:$version_framework_weaver_test"
  compileOnly "dev.zio:zio-test-sbt_3:$version_framework_ziotest"

  // test framework used to test this project
  testImplementation "org.scalatest:scalatest_3:$version_framework_scalatest"
}

podvalPublish {
  gitHubRepository = 'dubinsky/scalajs-gradle'
}

publishing {
  publications {
    library(MavenPublication) {
      from components.java
    }
  }
}

ext.scalaTags = [
  'scala', 'scalajs', 'scalanative', 'crosscompile',
  'sbt', 'testing',
  'airspec', 'hedgehog', 'junit4', 'munit', 'scalacheck', 'scalaprops', 'scalatest', 'specs2', 'utest', 'weaver', 'ziotest'
]

gradlePlugin {
  plugins {
    scalajs {
      id = 'org.podval.tools.scalajs'
      implementationClass = 'org.podval.tools.backend.BackendPlugin'
      displayName = project.description
      description = project.description
      tags = scalaTags
    }
    scala {
      id = 'org.podval.tools.scala'
      implementationClass = 'org.podval.tools.backend.BackendPlugin'
      displayName = project.description
      description = project.description
      tags = scalaTags
    }
    scalaSettings {
      id = 'org.podval.tools.scala.settings'
      implementationClass = 'org.podval.tools.backend.ScalaSettingsPlugin'
      displayName = 'Settings for the multi-backend Scala plugin'
      description = 'Includes backend and shared projects, and selects the Scala backend.'
      tags = scalaTags
    }
  }
}
