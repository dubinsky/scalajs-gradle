# Weekly dependencyUpdates report.
# The task is registered by org.podval.conventions.settings
# (io.github.ben-manes.versions.settings). That plugin rejects non-stable
# candidates (alpha, beta, rc, milestones) and padded numeric components.

name: Dependency updates

on:
  schedule:
    # Monday 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dependency-updates-${{ github.repository }}
  cancel-in-progress: true

jobs:
  dependency-updates:
    name: Check for dependency updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java (Temurin 25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run dependencyUpdates
        run: ./gradlew dependencyUpdates --output-formatter=json,plain

      - name: Publish report to job summary
        run: |
          set -euo pipefail
          report=build/dependencyUpdates/report.txt
          if [[ ! -f "$report" ]]; then
            echo "::error::Missing ${report}"
            exit 1
          fi
          {
            echo "## Dependency updates"
            echo
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/
          if-no-files-found: error
